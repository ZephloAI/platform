---
# Inventory for multi-region k3s cluster
# Replace 203.0.113.x IPs with actual server public IPs before running

all:
  children:
    # k3s control plane - ALL nodes are servers for HA (3-node etcd quorum)
    # us-server-1 initializes the cluster, others join as additional servers
    k3s_server:
      hosts:
        us-server-1:
          ansible_host: 207.244.231.203
          wireguard_ip: 10.10.0.1
          pod_cidr: 10.42.0.0/24   # Node-specific pod subnet (must not overlap)
          node_region: us
          node_zone: us-central
          k3s_role: server
          k3s_init: true           # First server - initializes cluster

        us-server-2:
          ansible_host: 207.244.235.220
          wireguard_ip: 10.10.0.2
          pod_cidr: 10.42.1.0/24
          node_region: us
          node_zone: us-central
          k3s_role: server
          k3s_init: false          # Joins existing cluster

        eu-server-1:
          ansible_host: 157.173.108.238
          wireguard_ip: 10.10.0.3
          pod_cidr: 10.42.3.0/24
          node_region: eu
          node_zone: eu-west
          k3s_role: server
          k3s_init: false          # Joins existing cluster

    # Regional groupings (for region-specific tasks)
    us_servers:
      hosts:
        us-server-1:
        us-server-2:

    eu_servers:
      hosts:
        eu-server-1:

  vars:
    ansible_user: deploy
    ansible_python_interpreter: /usr/bin/python3
