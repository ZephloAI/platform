---
# kube-prometheus-stack Helm values
# Prometheus, Grafana, and AlertManager for k3s cluster monitoring

# --- Grafana ---
grafana:
  enabled: true

  # Admin credentials - CHANGE IN PRODUCTION
  adminUser: admin
  adminPassword: "J3xvWoH9iQ@47"  # Replace with a strong password
  # Ingress
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.flunkie.ai
    tls:
      - hosts:
          - grafana.flunkie.ai
        secretName: grafana-tls

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Persistent storage for dashboards
  persistence:
    enabled: true
    size: 5Gi

  # Default dashboards
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: utc

# --- Prometheus ---
prometheus:
  prometheusSpec:
    # Data retention
    retention: 15d
    retentionSize: "10GB"

    # Storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # Resource limits
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi

    # Scrape all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

# --- AlertManager ---
alertmanager:
  enabled: true

  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

    # Storage
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

  # AlertManager configuration
  config:
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'default'
      routes:
        - match:
            severity: critical
          receiver: 'critical'
          repeat_interval: 1h

    receivers:
      - name: 'default'
        # Configure your notification channel here
        # Example: Slack webhook
        # slack_configs:
        #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
        #     channel: '#alerts'
        #     send_resolved: true

      - name: 'critical'
        # Configure critical alert notifications here
        # slack_configs:
        #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
        #     channel: '#critical-alerts'
        #     send_resolved: true

# --- Basic Alerting Rules ---
additionalPrometheusRulesMap:
  custom-rules:
    groups:
      - name: cluster-health
        rules:
          # Node is not ready for more than 5 minutes
          - alert: NodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} is not ready"
              description: "Node {{ $labels.node }} has been not ready for more than 5 minutes."

          # High CPU usage on node
          - alert: HighNodeCPU
            expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage on {{ $labels.instance }}"
              description: "CPU usage is above 85% for more than 10 minutes."

          # High memory usage on node
          - alert: HighNodeMemory
            expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage on {{ $labels.instance }}"
              description: "Memory usage is above 85% for more than 10 minutes."

          # Disk space running low
          - alert: DiskSpaceLow
            expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Low disk space on {{ $labels.instance }}"
              description: "Less than 15% disk space remaining on root filesystem."

          # Pod crash looping
          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
              description: "Pod has restarted more than 3 times in the last 15 minutes."

          # Pod not ready
          - alert: PodNotReady
            expr: kube_pod_status_ready{condition="true"} == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"
              description: "Pod has been not ready for more than 10 minutes."

# --- Node Exporter ---
nodeExporter:
  enabled: true

# --- Kube State Metrics ---
kubeStateMetrics:
  enabled: true

# --- Disable components not needed on k3s ---
kubeEtcd:
  enabled: false  # k3s uses embedded sqlite/etcd

kubeControllerManager:
  enabled: false  # k3s bundles this

kubeScheduler:
  enabled: false  # k3s bundles this

kubeProxy:
  enabled: false  # k3s bundles this
