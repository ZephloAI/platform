---
# Monitoring stack installation
# Installs kube-prometheus-stack (Prometheus, Grafana, AlertManager) via Helm

# --- Add Helm repos ---
- name: Add prometheus-community Helm repository
  command: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: repo_add
  changed_when: "'has been added' in repo_add.stdout"
  failed_when: repo_add.rc != 0 and 'already exists' not in repo_add.stderr

- name: Add Grafana Helm repository (for Loki)
  command: helm repo add grafana https://grafana.github.io/helm-charts
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: grafana_repo
  changed_when: "'has been added' in grafana_repo.stdout"
  failed_when: grafana_repo.rc != 0 and 'already exists' not in grafana_repo.stderr

- name: Update Helm repositories
  command: helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

# --- Create monitoring namespace ---
- name: Create monitoring namespace
  command: kubectl create namespace monitoring
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: ns_result
  changed_when: ns_result.rc == 0
  failed_when: ns_result.rc != 0 and 'already exists' not in ns_result.stderr

# --- Copy values file ---
- name: Copy monitoring Helm values
  copy:
    src: "{{ playbook_dir }}/../files/monitoring-values.yaml"
    dest: /tmp/monitoring-values.yaml
    mode: "0644"

# --- Install kube-prometheus-stack ---
- name: Install kube-prometheus-stack via Helm
  command: >
    helm upgrade --install kube-prometheus-stack
    prometheus-community/kube-prometheus-stack
    --namespace monitoring
    --version {{ kube_prometheus_stack_version }}
    --values /tmp/monitoring-values.yaml
    --wait --timeout 10m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

# --- Clean up prometheus values ---
- name: Remove temporary monitoring values file
  file:
    path: /tmp/monitoring-values.yaml
    state: absent

# --- Loki + Promtail (centralized logging, 14-day retention) ---
- name: Copy Loki Helm values
  copy:
    src: "{{ playbook_dir }}/../files/loki-values.yaml"
    dest: /tmp/loki-values.yaml
    mode: "0644"

- name: Install Loki stack via Helm
  command: >
    helm upgrade --install loki
    grafana/loki
    --namespace monitoring
    --values /tmp/loki-values.yaml
    --wait --timeout 10m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Install Promtail via Helm
  command: >
    helm upgrade --install promtail
    grafana/promtail
    --namespace monitoring
    --set config.clients[0].url=http://loki:3100/loki/api/v1/push
    --wait --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Remove temporary Loki values file
  file:
    path: /tmp/loki-values.yaml
    state: absent

# --- Add Loki as Grafana datasource ---
- name: Get Grafana admin password
  command: >
    kubectl get secret kube-prometheus-stack-grafana
    -n monitoring -o jsonpath="{.data.admin-password}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: grafana_password_b64
  changed_when: false

- name: Get Grafana pod name
  command: >
    kubectl get pod -n monitoring -l app.kubernetes.io/name=grafana
    -o jsonpath="{.items[0].metadata.name}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: grafana_pod
  changed_when: false

- name: Add Loki datasource to Grafana
  command: >
    kubectl exec {{ grafana_pod.stdout }} -n monitoring -c grafana --
    curl -s -X POST http://localhost:3000/api/datasources
    -H "Content-Type: application/json"
    -u "admin:{{ grafana_password_b64.stdout | b64decode }}"
    -d '{"name":"Loki","type":"loki","url":"http://loki:3100","access":"proxy","isDefault":false}'
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: loki_ds
  changed_when: "'Datasource added' in loki_ds.stdout"
  failed_when: false

# --- Verify installation ---
- name: Wait for Prometheus to be ready
  command: >
    kubectl rollout status statefulset/prometheus-kube-prometheus-stack-prometheus
    -n monitoring --timeout=300s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Wait for Grafana to be ready
  command: >
    kubectl rollout status deployment/kube-prometheus-stack-grafana
    -n monitoring --timeout=300s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Display monitoring stack status
  command: kubectl get pods -n monitoring -o wide
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: monitoring_pods
  changed_when: false

- name: Show monitoring pods
  debug:
    msg: "{{ monitoring_pods.stdout_lines }}"
