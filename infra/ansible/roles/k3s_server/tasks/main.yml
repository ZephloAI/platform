---
# K3s server installation (HA multi-server setup)
#
# All 3 nodes run as k3s servers for HA etcd quorum:
#   - First node (k3s_init=true): initializes cluster with --cluster-init
#   - Additional nodes (k3s_init=false): join via --server URL
#
# This role runs on ALL k3s_server hosts. The playbook handles ordering
# (init node first, then joining nodes).

# --- Create k3s config directory ---
- name: Create k3s config directory
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

# --- Get token from init server (joining nodes only) ---
- name: Get k3s token from init server
  set_fact:
    k3s_token: "{{ hostvars['us-server-1'].k3s_token }}"
  when: not (k3s_init | default(false))

# --- Template k3s server config ---
- name: Template k3s server configuration
  template:
    src: k3s-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  notify: Restart k3s

# --- Install k3s server ---
- name: Install k3s server
  shell: |
    curl -sfL {{ k3s_install_url }} | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - server
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_SKIP_START: "false"

- name: Wait for k3s to be ready
  command: k3s kubectl get nodes
  register: k3s_ready
  retries: 30
  delay: 10
  until: k3s_ready.rc == 0
  changed_when: false

# --- Fetch node-token (init server only, needed by joining nodes) ---
- name: Read k3s node token
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw
  when: k3s_init | default(false)

- name: Set k3s token as fact (for other nodes to reference)
  set_fact:
    k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"
  when: k3s_init | default(false)

# --- Fetch kubeconfig (init server only) ---
- name: Fetch kubeconfig from init server
  fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /tmp/kubeconfig-{{ inventory_hostname }}
    flat: true
  when: k3s_init | default(false)

- name: Update kubeconfig server address for remote access
  delegate_to: localhost
  become: false
  replace:
    path: /tmp/kubeconfig-{{ inventory_hostname }}
    regexp: '127\.0\.0\.1'
    replace: "{{ wireguard_ip }}"
  when: k3s_init | default(false)

- name: Display kubeconfig location
  debug:
    msg: "Kubeconfig saved to /tmp/kubeconfig-{{ inventory_hostname }} (server: {{ wireguard_ip }}:6443)"
  when: k3s_init | default(false)

# --- Verify cluster (run once from any server) ---
- name: Verify cluster nodes
  command: k3s kubectl get nodes -o wide
  register: nodes_output
  changed_when: false
  run_once: true

- name: Show cluster nodes
  debug:
    msg: "{{ nodes_output.stdout_lines }}"
  run_once: true
