---
# WireGuard mesh network setup
# Creates a full-mesh VPN between all nodes

# --- Install WireGuard ---
- name: Install WireGuard
  apt:
    name: wireguard
    state: present

# --- Generate Key Pairs ---
- name: Check if WireGuard private key exists
  stat:
    path: /etc/wireguard/private.key
  register: wg_private_key

- name: Generate WireGuard private key
  when: not wg_private_key.stat.exists
  shell: wg genkey > /etc/wireguard/private.key
  args:
    creates: /etc/wireguard/private.key

- name: Set private key permissions
  file:
    path: /etc/wireguard/private.key
    mode: "0600"
    owner: root
    group: root

- name: Generate WireGuard public key
  shell: cat /etc/wireguard/private.key | wg pubkey
  register: wg_public_key
  changed_when: false

- name: Read WireGuard private key
  slurp:
    src: /etc/wireguard/private.key
  register: wg_private_key_content

# --- Share Public Keys ---
# Store public keys as host facts so we can build the mesh config
- name: Set WireGuard public key as host fact
  set_fact:
    wg_pubkey: "{{ wg_public_key.stdout }}"
    wg_privkey: "{{ wg_private_key_content.content | b64decode | trim }}"

# --- Template WireGuard Config ---
- name: Template WireGuard configuration
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
    owner: root
    group: root
  notify: Restart WireGuard

# --- Enable and Start WireGuard ---
- name: Enable and start WireGuard
  systemd:
    name: wg-quick@wg0
    enabled: true
    state: started

# --- Verify Connectivity ---
- name: Wait for WireGuard interface to come up
  wait_for:
    timeout: 10

- name: Verify WireGuard connectivity to all peers
  command: "ping -c 3 -W 5 {{ hostvars[item].wireguard_ip }}"
  loop: "{{ groups['all'] | difference([inventory_hostname]) }}"
  register: ping_results
  retries: 3
  delay: 5
  until: ping_results.rc == 0
  changed_when: false
