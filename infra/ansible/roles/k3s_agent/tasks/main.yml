---
# K3s agent (worker node) installation
# Joins the node to the k3s cluster via WireGuard network

# --- Create k3s config directory ---
- name: Create k3s config directory
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

# --- Template k3s agent config ---
- name: Template k3s agent configuration
  template:
    src: k3s-agent-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  notify: Restart k3s-agent

# --- Get k3s token from server ---
- name: Get k3s token from control plane
  set_fact:
    k3s_token: "{{ hostvars[groups['k3s_server'][0]].k3s_token }}"

# --- Install k3s agent ---
- name: Check if k3s agent is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_agent_binary

- name: Install k3s agent
  shell: |
    curl -sfL {{ k3s_install_url }} | \
    INSTALL_K3S_VERSION="{{ k3s_version }}" \
    K3S_URL="{{ k3s_server_url }}" \
    K3S_TOKEN="{{ k3s_token }}" \
    sh -s - agent
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_SKIP_START: "false"

- name: Wait for k3s agent to start
  systemd:
    name: k3s-agent
    state: started
    enabled: true

# --- Verify node joined the cluster ---
- name: Wait for node to register with cluster
  delegate_to: "{{ groups['k3s_server'][0] }}"
  command: >
    k3s kubectl get node {{ inventory_hostname }}
    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: node_ready
  retries: 30
  delay: 10
  until: node_ready.stdout == "True"
  changed_when: false

- name: Show cluster nodes after join
  delegate_to: "{{ groups['k3s_server'][0] }}"
  command: k3s kubectl get nodes -o wide
  register: all_nodes
  changed_when: false
  run_once: true

- name: Display cluster status
  debug:
    msg: "{{ all_nodes.stdout_lines }}"
  run_once: true
