---
# ArgoCD installation via Helm
# Installs ArgoCD for GitOps-based continuous delivery

# --- Ensure Helm is available ---
- name: Check Helm is installed
  command: which helm
  changed_when: false

# --- Add ArgoCD Helm repo ---
- name: Add ArgoCD Helm repository
  command: helm repo add argo https://argoproj.github.io/argo-helm
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: repo_add
  changed_when: "'has been added' in repo_add.stdout"
  failed_when: repo_add.rc != 0 and 'already exists' not in repo_add.stderr

- name: Update Helm repositories
  command: helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

# --- Create ArgoCD namespace ---
- name: Create argocd namespace
  command: kubectl create namespace argocd
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: ns_result
  changed_when: ns_result.rc == 0
  failed_when: ns_result.rc != 0 and 'already exists' not in ns_result.stderr

# --- Copy values file ---
- name: Copy ArgoCD Helm values
  copy:
    src: "{{ playbook_dir }}/../files/argocd-values.yaml"
    dest: /tmp/argocd-values.yaml
    mode: "0644"

# --- Install ArgoCD ---
- name: Install ArgoCD via Helm
  command: >
    helm upgrade --install argocd argo/argo-cd
    --namespace argocd
    --version {{ argocd_chart_version }}
    --values /tmp/argocd-values.yaml
    --wait --timeout 10m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

# --- Clean up ---
- name: Remove temporary values file
  file:
    path: /tmp/argocd-values.yaml
    state: absent

# --- Wait for ArgoCD ---
- name: Wait for ArgoCD server deployment to be ready
  command: >
    kubectl rollout status deployment/argocd-server
    -n argocd --timeout=300s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

# --- Get initial admin password ---
- name: Get ArgoCD initial admin password
  shell: >
    kubectl -n argocd get secret argocd-initial-admin-secret
    -o jsonpath="{.data.password}" | base64 -d
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_password
  changed_when: false

- name: Display ArgoCD admin password
  debug:
    msg: "ArgoCD initial admin password: {{ argocd_password.stdout }}"
