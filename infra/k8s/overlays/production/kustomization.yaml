apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-saas

resources:
  - ../../base

# Image tags are updated by CI/CD pipeline
images:
  - name: docker.io/flunkie/frontend
    newTag: fea3b027b26ac43b24525a73d9f279e0222a8e25
  - name: docker.io/flunkie/api
    newTag: fea3b027b26ac43b24525a73d9f279e0222a8e25
  - name: docker.io/flunkie/agent
    newTag: fea3b027b26ac43b24525a73d9f279e0222a8e25
  - name: docker.io/flunkie/crawler
    newTag: fea3b027b26ac43b24525a73d9f279e0222a8e25

# Production replica counts
replicas:
  - name: landing
    count: 2
  - name: frontend
    count: 2
  - name: api
    count: 2
  - name: agent
    count: 1
  - name: crawler
    count: 1

# Production resource limits
patches:
  # API: 512Mi memory, 500m CPU
  - target:
      kind: Deployment
      name: api
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          spec:
            containers:
              - name: api
                resources:
                  requests:
                    cpu: 250m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi

  # Agent: 2Gi memory, 1 CPU (needs memory for ML model)
  - target:
      kind: Deployment
      name: agent
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: agent
      spec:
        template:
          spec:
            containers:
              - name: agent
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                  limits:
                    cpu: "1"
                    memory: 2Gi

  # Crawler: 2Gi memory, 1000m CPU
  - target:
      kind: Deployment
      name: crawler
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: crawler
      spec:
        template:
          spec:
            containers:
              - name: crawler
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                  limits:
                    cpu: 1000m
                    memory: 2Gi

  # Landing: 256Mi memory, 250m CPU
  - target:
      kind: Deployment
      name: landing
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: landing
      spec:
        template:
          spec:
            containers:
              - name: landing
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 250m
                    memory: 256Mi

  # Frontend: 256Mi memory, 250m CPU
  - target:
      kind: Deployment
      name: frontend
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        template:
          spec:
            containers:
              - name: frontend
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 250m
                    memory: 256Mi
