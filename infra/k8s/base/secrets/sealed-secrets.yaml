# These are SealedSecret templates with placeholder values.
# In production, encrypt real values using kubeseal:
#   kubeseal --format yaml < secret.yaml > sealed-secret.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: db-credentials
  namespace: agent-saas
  labels:
    app.kubernetes.io/part-of: agent-saas
spec:
  encryptedData:
    POSTGRES_USER: PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    POSTGRES_PASSWORD: PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    DATABASE_URL: PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    DATABASE_URL_SYNC: PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    DATABASE_URL_ASYNCPG: PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
  template:
    metadata:
      name: db-credentials
      namespace: agent-saas
      labels:
        app.kubernetes.io/part-of: agent-saas
    type: Opaque
---
