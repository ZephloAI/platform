apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent
  namespace: agent-saas
  labels:
    app: agent
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: agent-saas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
