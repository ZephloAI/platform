apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: agent-saas
  labels:
    app: agent
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: agent-saas
  annotations:
    description: "WebSocket-enabled service with session affinity"
spec:
  type: ClusterIP
  # Session affinity ensures WebSocket connections stick to the same pod
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app: agent
  ports:
    - port: 8002
      targetPort: 8002
      protocol: TCP
