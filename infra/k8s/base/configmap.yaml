apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: agent-saas
  labels:
    app.kubernetes.io/part-of: agent-saas
data:
  # Database
  POSTGRES_DB: agent_saas

  # Service URLs (internal cluster DNS)
  CRAWLER_SERVICE_URL: "http://crawler:8001"
  AGENT_SERVICE_URL: "http://agent:8002"
  API_CALLBACK_URL: "http://api:8000"
  API_SERVICE_URL: "http://api:8000"

  # Qdrant
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"

  # Redis (cache)
  REDIS_URL: "redis://redis:6379/0"

  # OpenRouter
  OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"

  # Agent
  TOP_K: "5"
  EMBEDDING_MODEL: "all-MiniLM-L6-v2"

  # Crawler
  MAX_PAGES: "50"
  CHUNK_SIZE: "500"
  CHUNK_OVERLAP: "50"

  # JWT
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "1440"

  # OAuth
  MICROSOFT_TENANT_ID: "common"
