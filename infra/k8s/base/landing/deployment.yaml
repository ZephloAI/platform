apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: agent-saas
  labels:
    app: landing
    app.kubernetes.io/name: landing
    app.kubernetes.io/part-of: agent-saas
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: landing
  template:
    metadata:
      labels:
        app: landing
        app.kubernetes.io/name: landing
        app.kubernetes.io/part-of: agent-saas
    spec:
      imagePullSecrets:
        - name: dockerhub-credentials
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/region
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: landing
      containers:
        - name: landing
          image: docker.io/zephlo/landing:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
