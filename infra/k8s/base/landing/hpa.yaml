apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: landing
  namespace: agent-saas
  labels:
    app: landing
    app.kubernetes.io/name: landing
    app.kubernetes.io/part-of: agent-saas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: landing
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
