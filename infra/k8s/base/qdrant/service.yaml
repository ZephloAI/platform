apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: agent-saas
  labels:
    app: qdrant
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: agent-saas
spec:
  # Headless service for StatefulSet
  clusterIP: None
  selector:
    app: qdrant
  ports:
    - port: 6333
      targetPort: 6333
      protocol: TCP
      name: http
    - port: 6334
      targetPort: 6334
      protocol: TCP
      name: grpc
