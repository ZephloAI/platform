apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agent-saas
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: agent-saas
spec:
  # Headless service for StatefulSet
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
