# ArgoCD Application - Infrastructure components
# Deploys nginx-ingress controller and sealed-secrets via Helm.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-ingress
  namespace: argocd
spec:
  project: agent-saas

  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.10.0
    helm:
      values: |
        controller:
          replicaCount: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          metrics:
            enabled: true
          config:
            use-forwarded-headers: "true"
            proxy-body-size: "10m"

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

---
# Sealed Secrets controller for secret management
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-sealed-secrets
  namespace: argocd
spec:
  project: agent-saas

  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.15.0
    helm:
      values: |
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: agent-saas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
