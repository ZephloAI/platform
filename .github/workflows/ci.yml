# CI Pipeline - Build, push Docker images, and update manifests for ArgoCD
# Builds all services in parallel using a matrix strategy.
name: CI - Build, Push & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/k8s/overlays/production/kustomization.yaml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [api, agent, crawler, frontend, landing]
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push ${{ matrix.service }}
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}"

          if [ "${{ matrix.service }}" = "landing" ]; then
            # Context = repo root: Dockerfile copies both widget/ and landing/
            # so the local widget can be built and aliased into the Next bundle.
            docker build --platform linux/amd64 \
              -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" \
              -f landing/Dockerfile .
          elif [ "${{ matrix.service }}" = "frontend" ]; then
            docker build --platform linux/amd64 \
              -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" \
              -f frontend/Dockerfile \
              --build-arg ENV=dev \
              --build-arg NGINX_CONF=nginx-k8s.conf \
              --build-arg VITE_GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              --build-arg VITE_MICROSOFT_CLIENT_ID="${{ secrets.MICROSOFT_CLIENT_ID }}" .
          else
            docker build --platform linux/amd64 \
              -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" \
              ./${{ matrix.service }}
          fi

          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # Update image tags in git so ArgoCD auto-deploys
  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in kustomization
        run: |
          FILE=infra/k8s/overlays/production/kustomization.yaml
          SHA="${{ github.sha }}"
          ORG="${{ secrets.DOCKERHUB_USERNAME }}"

          python3 -c "
          import re
          content = open('$FILE').read()
          for svc in ['api', 'crawler', 'agent', 'frontend', 'landing']:
            pattern = rf'(name: docker\.io/$ORG/{svc}\n\s+newTag:) .+'
            content = re.sub(pattern, rf'\1 $SHA', content)
          open('$FILE', 'w').write(content)
          "
          echo "Updated tags to $SHA:"
          cat $FILE | grep -A1 "name: docker.io/$ORG"

      - name: Commit and push updated tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/overlays/production/kustomization.yaml
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "ci: update image tags to ${{ github.sha }}"
          git push

  # Clean up Docker images after builds
  cleanup:
    needs: [build-and-push, update-manifests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Prune Docker images older than 6 hours
        run: docker image prune -af --filter "until=6h"

      - name: Prune build cache older than 6 hours
        run: docker builder prune -af --filter "until=6h"

      - name: Show disk usage
        run: docker system df
