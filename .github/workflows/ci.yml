# CI Pipeline - Build, push Docker images, and update manifests for ArgoCD
# Builds all services sequentially on every push to main.
# Sequential to avoid resource contention on ubuntu-24.04 runner.
name: CI - Build, Push & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/k8s/overlays/production/kustomization.yaml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push API
        run: |
          docker build --platform linux/amd64 -t flunkie/api:${{ github.sha }} -t flunkie/api:latest ./api
          docker push flunkie/api:${{ github.sha }}
          docker push flunkie/api:latest

      - name: Build and push Frontend
        run: |
          docker build --platform linux/amd64 -t flunkie/frontend:${{ github.sha }} -t flunkie/frontend:latest \
            -f frontend/Dockerfile --build-arg ENV=dev --build-arg NGINX_CONF=nginx-k8s.conf \
            --build-arg VITE_GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --build-arg VITE_MICROSOFT_CLIENT_ID="${{ secrets.MICROSOFT_CLIENT_ID }}" .
          docker push flunkie/frontend:${{ github.sha }}
          docker push flunkie/frontend:latest

      - name: Build and push Agent
        run: |
          docker build --platform linux/amd64 -t flunkie/agent:${{ github.sha }} -t flunkie/agent:latest ./agent
          docker push flunkie/agent:${{ github.sha }}
          docker push flunkie/agent:latest

      - name: Build and push Crawler
        run: |
          docker build --platform linux/amd64 -t flunkie/crawler:${{ github.sha }} -t flunkie/crawler:latest ./crawler
          docker push flunkie/crawler:${{ github.sha }}
          docker push flunkie/crawler:latest

  # Update image tags in git so ArgoCD auto-deploys
  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in kustomization
        run: |
          FILE=infra/k8s/overlays/production/kustomization.yaml
          SHA="${{ github.sha }}"

          python3 -c "
          import re
          content = open('$FILE').read()
          for svc in ['api', 'crawler', 'agent', 'frontend']:
            pattern = rf'(name: docker\.io/flunkie/{svc}\n\s+newTag:) .+'
            content = re.sub(pattern, rf'\1 $SHA', content)
          open('$FILE', 'w').write(content)
          "
          echo "Updated tags to $SHA:"
          cat $FILE | grep -A1 "name: docker.io/flunkie"

      - name: Commit and push updated tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/overlays/production/kustomization.yaml
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "ci: update image tags to ${{ github.sha }}"
          git push

  # Clean up Docker images after builds
  cleanup:
    needs: [build-and-push, update-manifests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Prune Docker images older than 6 hours
        run: docker image prune -af --filter "until=6h"

      - name: Prune build cache older than 6 hours
        run: docker builder prune -af --filter "until=6h"

      - name: Show disk usage
        run: docker system df