# Build & push the crawler BASE image (flunkie/crawler-base).
#
# This carries the heavy, slow-changing layers (Python deps, PyTorch,
# scrapy-playwright + Chromium, the embedding model). The normal crawler build
# in ci.yml just layers app code on top of it, so it stays fast.
#
# Triggered manually only (Actions tab -> "Run workflow"). Run it when the
# crawler's dependencies or base Dockerfile change. After it pushes, re-run
# ci.yml (or push any commit) so the crawler image picks up the new base.
name: Crawler Base Image

on:
  workflow_dispatch:

jobs:
  build-and-push-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push crawler-base
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/crawler-base"
          docker build --platform linux/amd64 \
            -f crawler/Dockerfile.base \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" \
            crawler
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
