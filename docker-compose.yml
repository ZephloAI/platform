services:
  # ---- Supporting Services ----
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatbot_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Application Services ----
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/chatbot_saas
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: super-secret-change-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440
      CRAWLER_SERVICE_URL: http://crawler:8001
      AGENT_SERVICE_URL: http://agent:8002
      API_CALLBACK_URL: http://api:8000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Zephlo <invites@zephlo.ai>}
      RESEND_INVITE_TEMPLATE_ID: ${RESEND_INVITE_TEMPLATE_ID}
      INVITE_EXPIRY_DAYS: ${INVITE_EXPIRY_DAYS:-7}
      INVITE_ACCEPT_URL_BASE: ${INVITE_ACCEPT_URL_BASE:-http://localhost/invitations/accept}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      crawler:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import httpx; r = httpx.get(\"http://localhost:8000/health\"); r.raise_for_status()'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      API_SERVICE_URL: http://api:8000
      MAX_PAGES: 100
      CHUNK_SIZE: 500
      CHUNK_OVERLAP: 50
      EMBEDDING_MODEL: all-MiniLM-L6-v2
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import httpx; r = httpx.get(\"http://localhost:8001/health\"); r.raise_for_status()'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      LLM_MODEL: ${OPENROUTER_MODEL}
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      TOP_K: 5
      JWT_SECRET: super-secret-change-in-production
      JWT_ALGORITHM: HS256
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/chatbot_saas
      DATABASE_URL_ASYNCPG: postgresql://postgres:postgres@postgres:5432/chatbot_saas
      ELEVEN_LABS_API_KEY: ${ELEVEN_LABS_API_KEY:-sk_97d75efebba2be48540cfdb8e4212c4939eb6885c7348809}
      ELEVEN_LABS_VOICE_ID: ${ELEVEN_LABS_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
      ELEVEN_LABS_MODEL_ID: ${ELEVEN_LABS_MODEL_ID:-eleven_multilingual_v2}
      API_CALLBACK_URL: http://api:8000
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import httpx; r = httpx.get(\"http://localhost:8002/health\"); r.raise_for_status()'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        ENV: ${ENV:-dev}
        NPM_TOKEN: ${NPM_TOKEN}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        VITE_MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
    ports:
      - "80:80"
    environment:
      - ASSISTANT_CHATBOT_ID=${ASSISTANT_CHATBOT_ID:-}
      - ASSISTANT_API_KEY=${ASSISTANT_API_KEY:-}
      - APP_ENV=${APP_ENV:-}
      - WIDGET_API_URL=${WIDGET_API_URL:-}
    depends_on:
      - api
    restart: unless-stopped

  landing:
    build:
      context: .
      dockerfile: landing/Dockerfile
      args:
        NEXT_PUBLIC_ZEPHLO_API_KEY: flk_3493a85b9bbe1651bd6750e5aeb46f68
        NEXT_PUBLIC_ZEPHLO_CHATBOT_ID: de9451c2-dc58-4af7-8ddf-be696eead2ba
        NEXT_PUBLIC_ZEPHLO_API_URL: http://localhost
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  huggingface_cache:
